name: Release

# Tag pushes (vYYYYMMDD.NN) are the single source of truth for release binaries.
# Building each version exactly once, this attaches the installable APK to the
# matching GitHub Release so the in-app "Check for updates" flow (UpdateChecker
# → IvanChanPing/Bada releases) can offer + install it.
#
# Variant/signing: we ship the DEBUG variant (package dev.superdrop.debug)
# signed with the shared Super Drop family keystore (injected from the single
# repo secret KEYSTORE_B64, creds = the well-known Android debug creds). This
# matches what's installed on device, so the updater performs a true DROP-IN
# update and the radio-helper BIND_RADIO signature permission keeps working.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Decode shared signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Repo secret KEYSTORE_B64 is not set." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/superdrop.keystore"
          chmod 600 "$RUNNER_TEMP/superdrop.keystore"

      - name: Build signed APK (shared key, radio-helper bundled)
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/superdrop.keystore
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: androiddebugkey
          KEY_PASSWORD: android
        run: ./gradlew :app:assembleDebug --refresh-dependencies --stacktrace

      - name: Resolve APK path
        id: apk
        shell: bash
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            printf 'Expected exactly one APK, found %s: %s\n' "${#apks[@]}" "${apks[*]:-<none>}" >&2
            exit 1
          fi
          apk_path="${apks[0]}"
          # Name the asset by the release tag so the download is recognisable.
          asset="super-drop-${GITHUB_REF_NAME}.apk"
          cp "$apk_path" "$asset"
          printf 'asset=%s\n' "$asset" >> "$GITHUB_OUTPUT"

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/superdrop.keystore"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.asset }}
          if-no-files-found: error
          path: ${{ steps.apk.outputs.asset }}

      - name: Attach APK to the matching GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="${GITHUB_REF_NAME}"
          repo="${GITHUB_REPOSITORY}"
          for attempt in $(seq 1 12); do
            if gh release view "$release_tag" --repo "$repo" >/dev/null 2>&1; then
              gh release upload "$release_tag" --repo "$repo" "${{ steps.apk.outputs.asset }}" --clobber
              exit 0
            fi
            sleep 5
          done
          echo "::warning::No GitHub Release found for ${release_tag}; the APK remains on the workflow run only."
