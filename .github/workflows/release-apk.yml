name: Release APK

# Publishes a downloadable GitHub Release for Super Drop.
#
# Why this exists: build-apk.yml uploads the APKs only as Actions artifacts
# (login required, 90-day expiry) and release.yml fires solely on `v*` tags
# inherited from upstream, so this fork has never produced a Release. This
# workflow builds the same shared-key-signed debug APKs and attaches them to a
# real Release, created from the "Run workflow" button with a tag you choose.
#
# Signing is identical to build-apk.yml: the shared Super Drop debug keystore
# from the KEYSTORE_B64 repo secret, so the published APK drop-in-updates what
# is already installed on device and keeps the BIND_RADIO signature permission.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create for this release (e.g. sd-v20260803.01)'
        required: true
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode shared signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Repo secret KEYSTORE_B64 is not set. Add it (base64 of the shared Super Drop keystore) so released APKs match the on-device signature." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/superdrop.keystore"
          chmod 600 "$RUNNER_TEMP/superdrop.keystore"

      - name: Assemble debug APKs (shared-key signed, radio-helper bundled)
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/superdrop.keystore
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: androiddebugkey
          KEY_PASSWORD: android
        run: ./gradlew :app:assembleDebug :radio-helper:assembleDebug --stacktrace

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/superdrop.keystore"

      - name: Collect release files
        run: |
          mkdir -p release-files
          cp app/build/outputs/apk/debug/*.apk release-files/super-drop-${{ inputs.tag }}.apk
          cp radio-helper/build/outputs/apk/debug/*.apk release-files/radio-helper-${{ inputs.tag }}.apk
          ls -l release-files

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" \
            --target "${{ github.sha }}" \
            --title "Super Drop ${{ inputs.tag }}" \
            --notes "Super Drop and the Radio Helper, built from ${{ github.sha }} on ${{ github.ref_name }}. Install both APKs; they share one signing key." \
            ${{ inputs.prerelease && '--prerelease' || '' }} \
            release-files/*.apk
